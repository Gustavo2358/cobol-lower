name: Checkpoint verification
"on":
  push:
    branches: ['**']
permissions:
  contents: read
  pull-requests: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    # Full B1/B2 regression + restored challenges takes ~12 min before bootstrap.
    timeout-minutes: 30
    env:
      LOWER_BUILD_ROOT: /tmp/lower-build-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
      MAVEN_OPTS: -Xmx3g
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harness dependencies
        run: python3 -m pip install -r scripts/harness/requirements.txt
      - name: Fixed AIR snapshot and upstream tests
        run: python3 scripts/harness/run.py bootstrap
      - name: Full first-slice gates and restored challenge
        run: python3 scripts/harness/run.py ci --commit "$GITHUB_SHA"
