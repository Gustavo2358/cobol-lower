name: Checkpoint verification
"on":
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOWER_BUILD_ROOT: /tmp/lower-build-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
      MAVEN_OPTS: -Xmx3g
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harness dependencies
        run: python3 -m pip install -r scripts/harness/requirements.txt
      - name: Remote fast gate only
        run: python3 scripts/harness/run.py ci-fast --commit "$CHECKOUT_SHA"
