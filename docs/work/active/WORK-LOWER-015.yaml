implementation: >-
  SP1.8 selects per-statement precision and conservative fallback after structural
  validation. BASIC bodies specialize by activation. Mandatory unknown whole writes
  use HavocMust; other unknown regions use Opaque envelopes. CALL targets survive
  partial surface/signature and unknown names. IF uses only source-certified Boolean
  predicates. Statement/operand links and localized gaps are retained. Legacy decoder
  contracts preserve their original semantics. No AST/COBOL parsing in the lower.
validation: >-
  FAST PASS including architecture and partial fixtures, /tmp/partial-lower-fast-1.log.
  Final qualification-local PASS, /tmp/partial-lower-full-5.log: semantic suites,
  backward decoder contracts, 20,000 MOVE capacity with real AIR validation and
  deterministic Publication equality, transport/atomicity and architecture.
  The first attempt exposed a historical future-version test using 1.8; it now
  uses 1.9 and the unknown-version refusal remains tested. Final productive boundary
  corrections below were requalified after the integrated findings.
review_state: IMPLEMENTED / AWAITING HUMAN REVIEW; integrated exact-pin gate in WORK-CFG-038.
integrated_corrections: >-
  Unit lineage links the actual initial sequence rather than duplicating entryOrigin.
  An unknown continuation after a proved write has a control-only Opaque, without
  repeating memory effects. Mandatory unknown writes remain HavocMust even when
  their continuation is unknown. Compound PERFORM and DISPLAY handler fixtures
  preserve source CALL sites and open control.
  The original PERFORM provenance oracle required the specialized return to retain
  callsite, resolved target, paragraph, body write and resume. This lineage is now
  explicit; interior body transfers retain their own structural continuation origin.
future_family_guard: >-
  Every typed nonterminal statement family must occur at least N times in each
  1/2/5/40 composition fixture, which must lower precisely without Opaque. New fact
  families therefore require updated generators and composition tests. Final test-only
  guard PASS, /tmp/partial-lower-contract-final.log; production unchanged since Full.
